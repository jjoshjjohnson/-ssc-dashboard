[build]
  publish = "sasha-ui"
  functions = "netlify/functions"

# Daily autonomous cycle — 05:00 UTC = 08:00 Israel
[functions."sasha-heartbeat"]
  schedule = "0 5 * * *"

[[redirects]]
  from = "/api/sasha-chat"
  to = "/.netlify/functions/sasha-chat"
  status = 200

[[redirects]]
  from = "/api/sasha-transcribe"
  to = "/.netlify/functions/sasha-transcribe"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "SAMEORIGIN"
