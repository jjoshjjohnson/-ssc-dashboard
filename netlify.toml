[build]
  publish = "sasha-ui"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sasha-chat"
  to = "/.netlify/functions/sasha-chat"
  status = 200

[[redirects]]
  from = "/api/sasha-transcribe"
  to = "/.netlify/functions/sasha-transcribe"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "SAMEORIGIN"
