<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WhatsApp Assistant — Dashboard</title>
<style>
  :root{
    --bg:#f5f6f8;--panel:#ffffff;--text:#1a1d21;--muted:#6b7280;--border:#e5e7eb;
    --bubble-in:#ffffff;--bubble-out:#dcf8c6;--accent:#25d366;--accent-dark:#128c7e;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1116;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--border:#2a2f37;
      --bubble-in:#1f242c;--bubble-out:#14532d;--accent:#25d366;--accent-dark:#1f9e73;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;max-width:360px;width:100%}
  .gate-card h1{font-size:18px;margin:0 0 6px}
  .gate-card p{font-size:13px;color:var(--muted);margin:0 0 18px}
  .gate-card input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:12px}
  .gate-card button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent-dark);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .gate-error{color:#dc2626;font-size:12px;margin-top:8px;min-height:16px}

  .app{display:none;height:100vh;grid-template-columns:1fr 300px}
  .app.active{display:grid}
  header{grid-column:1/-1;background:var(--accent-dark);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:16px;margin:0;font-weight:600}
  .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}

  .chat{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--border)}
  .bubble{max-width:70%;padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.4;white-space:pre-wrap}
  .in{align-self:flex-start;background:var(--bubble-in);border:1px solid var(--border)}
  .out{align-self:flex-end;background:var(--bubble-out)}
  .bubble time{display:block;font-size:10px;color:var(--muted);margin-top:4px}
  .empty{color:var(--muted);font-size:13px;text-align:center;margin-top:40px}

  .notes{overflow-y:auto;padding:16px;background:var(--panel)}
  .notes h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
  .note{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;margin-bottom:8px}
  .note time{display:block;font-size:10px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>WhatsApp Assistant</h1>
    <p>Enter the dashboard token to view messages and notes.</p>
    <input type="password" id="tokenInput" placeholder="Dashboard token" autocomplete="off">
    <button id="tokenSubmit">Unlock</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <h1>WhatsApp Assistant</h1>
    <div class="status"><span class="dot"></span><span id="statusText">Loading…</span></div>
  </header>
  <div class="chat" id="chat"><div class="empty">No messages yet.</div></div>
  <div class="notes">
    <h2>Saved Notes</h2>
    <div id="notesList"><div class="empty">No notes yet.</div></div>
  </div>
</div>

<script>
(function(){
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const tokenInput = document.getElementById('tokenInput');
  const tokenSubmit = document.getElementById('tokenSubmit');
  const gateError = document.getElementById('gateError');
  const chatEl = document.getElementById('chat');
  const notesEl = document.getElementById('notesList');
  const statusText = document.getElementById('statusText');

  let token = localStorage.getItem('wa_dashboard_token') || '';
  let pollHandle = null;

  function fmtTime(iso){
    return new Date(iso).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function render(data){
    if (data.messages.length === 0){
      chatEl.innerHTML = '<div class="empty">No messages yet.</div>';
    } else {
      chatEl.innerHTML = data.messages.map(m => `
        <div class="bubble ${m.direction === 'in' ? 'in' : 'out'}">
          ${escapeHtml(m.body)}
          <time>${fmtTime(m.created_at)}</time>
        </div>`).join('');
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    if (data.notes.length === 0){
      notesEl.innerHTML = '<div class="empty">No notes yet.</div>';
    } else {
      notesEl.innerHTML = data.notes.map(n => `
        <div class="note">${escapeHtml(n.content)}<time>${fmtTime(n.created_at)}</time></div>`).join('');
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function poll(){
    try {
      const res = await fetch('/api/data?token=' + encodeURIComponent(token));
      if (res.status === 401){
        localStorage.removeItem('wa_dashboard_token');
        showGate('Token rejected — try again.');
        return;
      }
      const data = await res.json();
      render(data);
      statusText.textContent = 'Synced ' + new Date().toLocaleTimeString();
    } catch (err) {
      statusText.textContent = 'Connection error';
    }
  }

  function showApp(){
    gate.style.display = 'none';
    app.classList.add('active');
    poll();
    pollHandle = setInterval(poll, 8000);
  }

  function showGate(errorMsg){
    if (pollHandle) clearInterval(pollHandle);
    app.classList.remove('active');
    gate.style.display = 'flex';
    gateError.textContent = errorMsg || '';
  }

  tokenSubmit.addEventListener('click', () => {
    const val = tokenInput.value.trim();
    if (!val) return;
    token = val;
    localStorage.setItem('wa_dashboard_token', val);
    showApp();
  });
  tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tokenSubmit.click(); });

  if (token) showApp(); else showGate();
})();
</script>
</body>
</html>
